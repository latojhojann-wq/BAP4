name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias y compilar web
        run: |
          npm install
          npm run build || true

      - name: Dar permisos de ejecución a Gradle y compilar APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generada (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: visor-url-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
